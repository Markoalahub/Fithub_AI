name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: test
      LANGCHAIN_TRACING_ENABLED: "false"
      DATABASE_URL: sqlite+aiosqlite:///./test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu -c constraints-docker.txt torch torchvision
          pip install -r requirements.txt -c constraints-docker.txt

      - name: Test
        run: python -m unittest discover -s tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fithub-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fithub-ai:${{ github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy FastAPI on EC2
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
          set -e
          cd /opt/fithub
          test -f .env
          test -f docker-compose.prod.yml
          docker compose --env-file .env -f docker-compose.prod.yml pull fithub-ai
          docker compose --env-file .env -f docker-compose.prod.yml up -d fithub-ai

          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' fithub-ai 2>/dev/null || true)
            echo "fithub-ai health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done

          docker logs --tail 100 fithub-ai
          exit 1
          EOF
